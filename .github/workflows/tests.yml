name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests + Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ecoplay-ci-secret
          JWT_EXPIRES_IN: 1h
          BCRYPT_SALT_ROUNDS: 4
          TEST_DATABASE_STORAGE: :memory:
          SEQUELIZE_LOGGING: false
