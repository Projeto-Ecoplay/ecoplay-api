  /api/amizades/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Amizades]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Amizade"
    delete:
      tags: [Amizades]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sem conteúdo

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Obtido em POST /api/auth/login (campo `token`).

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    ErrorMessage:
      type: object
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        checks:
          type: object
          additionalProperties: true

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/Usuario"

    Usuario:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string, nullable: true }
        email: { type: string }
        nivel: { type: integer }
        pontos: { type: integer }
        criado_em: { type: string, format: date-time, nullable: true }
        atualizado_em: { type: string, format: date-time, nullable: true }

    UsuarioCreate:
      type: object
      required: [email, senha]
      properties:
        nome: { type: string }
        email: { type: string, format: email }
        senha: { type: string, format: password }
        nivel: { type: integer }
        pontos: { type: integer }

    UsuarioUpdate:
      type: object
      properties:
        nome: { type: string }
        email: { type: string }
        senha: { type: string, format: password, description: "Nova senha (será hasheada)" }
        nivel: { type: integer }
        pontos: { type: integer }

    Missao:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string, nullable: true }
        descricao: { type: string, nullable: true }
        pontos_recompensa: { type: integer }
        nivel_requerido: { type: integer }
        criado_em: { type: string, format: date-time, nullable: true }

    MissaoInput:
      type: object
      properties:
        titulo: { type: string }
        descricao: { type: string }
        pontos_recompensa: { type: integer }
        nivel_requerido: { type: integer }

    UsuarioMissao:
      type: object
      properties:
        id: { type: integer }
        usuario_id: { type: integer }
        missao_id: { type: integer }
        status: { type: string, description: "ex. pending, completed" }
        data_conclusao: { type: string, format: date-time, nullable: true }

    UsuarioMissaoCreate:
      type: object
      required: [usuario_id, missao_id]
      properties:
        usuario_id: { type: integer }
        missao_id: { type: integer }
        status: { type: string }
        data_conclusao: { type: string, format: date-time }

    UsuarioMissaoUpdate:
      type: object
      properties:
        status: { type: string }
        data_conclusao: { type: string, format: date-time }

    Doacao:
      type: object
      properties:
        id: { type: integer }
        usuario_id: { type: integer }
        descricao: { type: string, nullable: true }
