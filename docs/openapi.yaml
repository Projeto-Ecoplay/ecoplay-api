      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarInput"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avatar"

  /api/avatares/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Avatares]
      security:
