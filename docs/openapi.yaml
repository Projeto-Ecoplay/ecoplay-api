      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioItem"

  /api/usuario-itens/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Utilizador — itens]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
