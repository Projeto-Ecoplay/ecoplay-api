      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    patch:
      tags: [Itens]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    delete:
      tags: [Itens]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sem conteúdo

  /api/usuario-itens:
    get:
      tags: [Utilizador — itens]
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: query
