openapi: 3.0.3
info:
  title: Ecoplay API
  description: |
    API REST da Ecoplay. Base JSON: `/api`.

    **Autenticação:** `POST /api/auth/login` devolve `token`. Nas restantes rotas (exceto login e registo) envia o header `Authorization: Bearer <token>`.

    **Registo:** `POST /api/usuarios` (público).
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local — em produção, usa "Try it out" com o URL público do teu serviço (ex. Render)

tags:
  - name: Raiz e saúde
    description: Endpoints fora do prefixo /api ou utilitários
  - name: Auth
    description: Login e sessão JWT
  - name: Usuários
  - name: Missões
  - name: Utilizador — missões
  - name: Doações
  - name: Itens
  - name: Utilizador — itens
  - name: Avatares
  - name: Utilizador — avatares
  - name: Amizades

paths:
  /:
    get:
      tags: [Raiz e saúde]
      summary: Informação da API
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }

  /health:
    get:
      tags: [Raiz e saúde]
      summary: Estado do serviço (Postgres / Supabase)
      responses:
        "200":
          description: Serviço considerado saudável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Algum check falhou
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/supabase-ready:
    get:
      tags: [Raiz e saúde]
      summary: Verifica se o cliente Supabase pode ser inicializado
      responses:
        "200":
          description: OK
        "503":
          description: Variáveis em falta
        "500":
          description: Erro

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login (obtém JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: user@exemplo.com
              senha: "secret"
      responses:
        "200":
          description: Token + dados do utilizador (sem senha)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Pedido inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Credenciais inválidas
        "503":
          description: JWT não configurado no servidor

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Perfil do utilizador autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          description: Token em falta ou inválido
        "404":
          description: Utilizador não encontrado

  /api/usuarios:
    get:
      tags: [Usuários]
      summary: Listar utilizadores
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
    post:
      tags: [Usuários]
      summary: Registar utilizador (público)
      description: A senha é armazenada com hash (bcrypt).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCreate"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          description: Validação
        "409":
          description: Email já registado

  /api/usuarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Usuários]
      summary: Obter utilizador com relações
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "404":
          description: Não encontrado
    put:
      tags: [Usuários]
      summary: Atualizar utilizador (substituição)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "404":
          description: Não encontrado
    patch:
      tags: [Usuários]
      summary: Atualizar utilizador (parcial)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
    delete:
      tags: [Usuários]
      summary: Eliminar utilizador e dados associados
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sem conteúdo
        "404":
          description: Não encontrado

  /api/missoes:
    get:
      tags: [Missões]
      security:
        - bearerAuth: []
      summary: Listar missões
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Missao"
    post:
      tags: [Missões]
      security:
        - bearerAuth: []
      summary: Criar missão
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissaoInput"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Missao"

  /api/missoes/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Missões]
      security:
        - bearerAuth: []
      summary: Obter missão
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Missao"
        "404":
          description: Não encontrado
    put:
      tags: [Missões]
      security:
        - bearerAuth: []
      summary: Atualizar missão
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissaoInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Missao"
    patch:
      tags: [Missões]
      security:
        - bearerAuth: []
      summary: Atualizar missão (parcial)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissaoInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Missao"
    delete:
      tags: [Missões]
      security:
        - bearerAuth: []
      summary: Eliminar missão
      responses:
        "204":
          description: Sem conteúdo
        "404":
          description: Não encontrado

  /api/usuario-missoes:
    get:
      tags: [Utilizador — missões]
      security:
        - bearerAuth: []
      summary: Listar associações utilizador–missão
      parameters:
        - name: usuario_id
          in: query
          schema:
            type: integer
        - name: missao_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioMissao"
    post:
      tags: [Utilizador — missões]
      security:
        - bearerAuth: []
      summary: Associar utilizador a uma missão
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioMissaoCreate"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioMissao"

  /api/usuario-missoes/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Utilizador — missões]
      security:
        - bearerAuth: []
      summary: Obter registo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioMissao"
    put:
      tags: [Utilizador — missões]
      security:
        - bearerAuth: []
      summary: Atualizar (ex. status, data_conclusao)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioMissaoUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioMissao"
    patch:
      tags: [Utilizador — missões]
      security:
        - bearerAuth: []
      summary: Atualizar parcial
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioMissaoUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioMissao"
    delete:
      tags: [Utilizador — missões]
      security:
        - bearerAuth: []
      summary: Remover associação
      responses:
        "204":
          description: Sem conteúdo

  /api/doacoes:
    get:
      tags: [Doações]
      security:
        - bearerAuth: []
      summary: Listar doações
      parameters:
        - name: usuario_id
          in: query
