              schema:
                $ref: "#/components/schemas/UsuarioAvatar"
    put:
      tags: [Utilizador — avatares]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioAvatarUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
